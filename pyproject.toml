[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "miraserver"
version = "0.8.8"
description = "High-performance inference server (Rust core + Python workers)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
scripts = {lite-server = "lite_server.cli:main"}
dependencies = [
    "pyyaml>=6.0",
    "pyzmq>=25.0",
    "protobuf>=5.0",
    "orjson>=3.9,<4",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.0",
    "httpx>=0.28.1",
    "pytest-timeout>=2.0",
    "grpcio>=1.62",
    "numpy>=1.24",
    "websockets>=13",
    "h2>=4.1",
]
benchmark = [
    "httpx>=0.28.1",
    "grpcio>=1.62",
    "numpy>=1.24",
    "websockets>=13",
    "h2>=4.1",
    "tokenizers>=0.20",
    # profile(方案决策点 1/7):psutil 自 dev 移入(非全新供应链),ruamel.yaml
    # 新增——config.yaml round-trip 保真重写 + 进程级 RSS/CPU 采样。
    "psutil>=5.9",
    "ruamel.yaml>=0.18",
]
validation = ["jsonschema>=4"]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "_lite_server"
bindings = "pyo3"
features = ["python"]
include = ["python/**/*.py", "python/**/*.yaml", "python/**/*.j2"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-n auto --dist=loadfile"

