# Dev config — light footprint, verbose logging, no gRPC, host-only binding.
server:
  http_port: 8000
  grpc_port: 0          # disable gRPC in dev
  host: "127.0.0.1"     # local-only in dev
  keepalive_timeout: 5

logging:
  level: debug

grpc:
  enabled: false

model_repository:
  path: ./model_repo

orchestration:
  control_mode: explicit
  load_models:
    - env_demo
