# Admin API + security (P6/P7): the admin gRPC service runs on its own UDS
# (grpc.admin_bind), both admin channels require an API key (access_control),
# and control-plane mutations write a structured audit log (info_output).
server:
  http_port: 8000

grpc:
  admin_bind: unix:./admin.sock   # P7-2: separate bind for LiteAdmin (UDS,
                                  # owner-only 0o600 by default)

access_control:
  admin:
    http: { mode: key, key: x-admin-key, value: "secret-admin-key" }
    grpc: { mode: key, key: x-admin-key, value: "secret-admin-key" }

logging:
  info_output: ./audit.log   # audit records land here (target lite-server::audit)

model_repository:
  path: ./model_repo

orchestration:
  control_mode: explicit
  load_models:
    - admin_echo
