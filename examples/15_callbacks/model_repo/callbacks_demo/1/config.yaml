max_batch_size: 1
stream: false
accelerator: cpu
devices: 1
workers_per_device: 1

# Inference pipeline callbacks (Python Callback subclasses).
# Each entry is a class path (no-arg) or a single-key map {path: kwargs};
# they chain in order and run AFTER LitAPI.callbacks (the class attribute
# in model.py).
callbacks:
  - callbacks.RequestTimer
  - callbacks.SimpleCache
  # Built-in schema validation (needs `pip install lite-server[validation]`):
  # validates the request body (ctx.request) in on_request, before
  # decode_request runs — no model code (decode or predict) ever sees an
  # invalid payload. The schema demonstrates: required vs optional fields,
  # bounded numbers, a field that is required but may be null, lists of
  # objects with enums, and rejection of unknown fields.
  - lite_server.callbacks.JsonSchemaValidator:
      input_schema:
        type: object
        required: [text, note]        # must be present; default is optional
        additionalProperties: false   # unknown fields -> 400
        properties:
          text:                       # required, non-empty string
            type: string
            minLength: 1
            maxLength: 1000
          note:                       # required, but null is allowed
            type: [string, "null"]    # "null" must be quoted in YAML
          max_tokens:                 # optional, bounded integer
            type: integer
            minimum: 1
            maximum: 2048
          temperature:                # optional, bounded float
            type: number
            minimum: 0.0
            maximum: 2.0
          messages:                   # optional list — `items` is itself a
            type: array               # schema describing each element
            items:
              type: object
              required: [role, content]
              properties:
                role: { type: string, enum: [user, assistant, system] }
                content: { type: string }
  - callbacks.ErrorMetrics
  - callbacks.LifecycleTracer
