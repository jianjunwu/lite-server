# Proxy & browser security (P-XFF / P-CORS): the local peer is a trusted
# proxy, so forwarded client IPs are honored (and cleansed); per-model CORS
# governs cross-origin browser access and WebSocket handshake Origins.
server:
  http_port: 8000
  trusted_proxies: ["127.0.0.1"]   # demo: treat loopback as a fronting proxy.
                                   # Default (empty) = ignore XFF entirely (fail-safe).

model_repository:
  path: ./model_repo

orchestration:
  control_mode: explicit
  load_models:
    - proxy_echo
