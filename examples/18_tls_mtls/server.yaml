# TLS/mTLS (P5-1): the HTTP listener requires TLS, and mtls_ca_path makes
# client certificates REQUIRED (mutual TLS). Certificates are generated by
# setup.sh (idempotent) and can be rotated at runtime without a restart —
# the server watches the PEM files (10s poll + instant SIGHUP on Unix).
server:
  http_port: 8000
  tls_cert_path: ./certs/server.crt
  tls_key_path: ./certs/server.key
  mtls_ca_path: ./certs/ca.crt
  tls_min_version: "1.3"

model_repository:
  path: ./model_repo

orchestration:
  control_mode: explicit
  load_models:
    - tls_echo
