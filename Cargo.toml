[package]
name = "lite-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lite-server-core"
path = "src/main.rs"

[dependencies]
# async runtime
tokio = { version = "1.40", features = ["full", "process"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# HTTP framework
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-full"] }
hyper = { version = "1.5", features = ["full"] }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"

# error handling
thiserror = "2.0"
anyhow = "1.0"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# metrics
prometheus = "0.13"
lazy_static = "1.5"

# file watching
notify = { version = "6.1", default-features = false, features = ["macos_fsevent"] }

# Python interop
pyo3 = { version = "0.24", features = ["auto-initialize", "serde"] }

# utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
bytes = "1.8"
pin-project = "1.1"
dashmap = "6.1"
arc-swap = "1.7"
once_cell = "1.20"

# config
config = { version = "0.14", features = ["yaml"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# random
rand = "0.8"

# regex
regex = "1"

# base64
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
