[package]
name = "lite-server"
version = "0.8.3"
edition = "2021"

[[bin]]
name = "lite-server-core"
path = "src/main.rs"

[dependencies]
# async runtime
tokio = { version = "1.40", features = ["full", "process"] }

# HTTP framework
axum = { version = "0.7", features = ["ws", "multipart"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http = "1.0"
form_urlencoded = "1.2"

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
mime = "0.3"
serde_yaml = "0.9"
bincode = "1.3"
prost = "0.13"
prost-types = "0.13"

# version ordering for load_policy = "latest"
semver = "1.0"

# P-XFF: trusted-proxy CIDR matching for client-IP cleansing (pure Rust,
# cross-platform; hand-rolling IPv6 prefix checks is error-prone).
ipnet = "2"

# P7-1: constant-time API-key comparison (timing side-channel). Already in the
# dependency graph via rustls; pinned here as a direct dependency.
subtle = "2"
# P7-2: getuid for admin UDS owner checks (cfg unix). Already in the graph via
# tokio/mio; pinned as a direct dependency.
libc = "0.2"

# gRPC
# P-TRACE (蓝图 §6.3): tonic 0.13 — opentelemetry-otlp 0.30 依赖 tonic ^0.13，
# 升级全家桶到 0.13 统一单一 tonic 版本，消除 rustls/tonic 多版本分裂风险。
tonic = { version = "0.13", features = ["gzip", "tls-ring"] }
tonic-health = { version = "0.13" }
# gRPC reflection (评审低#12, opt-in): grpc.reflection=true 时挂载 v1 reflection
# 服务，grpcurl/grpcui 免本地 proto 即可探测 LiteServer/Admin/health。默认关。
tonic-reflection = { version = "0.13" }
tokio-stream = { version = "0.1", features = ["net"] }

# TLS/mTLS (P5-1, 蓝图 §4.3): 统一 ring provider（评审 2.4）——axum-server 的
# tls-rustls feature 会拉 aws-lc-rs，故零 feature 引用、TLS 全部经自建
# acceptor/incoming（支持热轮换；静态 RustlsConfig/ServerTlsConfig 无法重建）。
axum-server = { version = "0.7", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
x509-parser = { version = "0.16", default-features = false }
sha2 = "0.10"

# HTTP middleware (response compression, P1-4)
tower-http = { version = "0.6", features = ["compression-gzip"] }
# Service trait for the HTTP TLS acceptor's extension-injecting wrapper (P5-1)
tower-service = "0.3"

# OpenTelemetry core only (P-MW, 蓝图 §4.0.1 评审 1.10): RequestContext.trace_cx
# 的类型载体。恒依赖、无 SDK/exporter（P-TRACE 才以 opt-in feature 引入）。
# P-TRACE：启用 `trace` feature（仍是 core API：SpanContext/TraceContextExt/Tracer
# trait，不含 SDK/exporter），供 trace_cx span 检查与测试断言。
opentelemetry = { version = "0.30", default-features = false, features = ["trace", "metrics"] }

# P-TRACE (蓝图 §4.3 / §6.7): OTel SDK + OTLP/gRPC exporter + tracing 桥接 +
# metrics SDK（exemplars）。feature-gated（`telemetry`，默认关）；版本互相对齐到
# opentelemetry 0.30——opentelemetry-otlp 0.30 拉 tonic ^0.13（与上面 tonic 0.13
# 统一）、reqwest ^0.12、prost ^0.13；tracing-opentelemetry 0.31 绑定 opentelemetry 0.30
# （0.30 版绑定 0.29，故用 0.31）。
opentelemetry_sdk = { version = "0.30", default-features = false, features = ["rt-tokio", "trace", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["grpc-tonic", "trace", "metrics"], optional = true }
tracing-opentelemetry = { version = "0.31", default-features = false, optional = true }

# transport
zmq = "0.10"

# error handling
thiserror = "2.0"
anyhow = "1.0"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# metrics
prometheus = "0.13"
lazy_static = "1.5"

# file watching
notify = { version = "6.1", default-features = false, features = ["macos_fsevent"] }

# utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1.8"
pin-project = "1.1"
dashmap = "6.1"
arc-swap = "1.7"
once_cell = "1.20"

# config
config = { version = "0.14", features = ["yaml"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# random
rand = "0.8"

# regex
regex = "1"

# base64
base64 = "0.22"

# HTTP client (for worker lifecycle hooks)
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Python interop
pyo3 = { version = "0.24", features = ["serde", "abi3-py310", "extension-module"], optional = true }
gethostname = "1.1.0"
tonic-types = "0.13"

[features]
default = []
python = ["dep:pyo3"]
# P-TRACE: OTel traces + metrics SDK (exemplars) + OTLP/gRPC exporter + tracing
# 桥接。默认关——默认构建零 OTel 开销、CI 矩阵不受影响；运行时再由
# `telemetry.enabled` opt-in。蓝图 §6.7 SDK/exporter feature-gated。
telemetry = ["dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[build-dependencies]
tonic-build = "0.13"
prost-build = "0.13"

[dev-dependencies]
tokio-test = "0.4"
# rustls 版 HTTP 客户端（P5-1 e2e）：与服务端同一 TLS 栈 + ring provider
# （蓝图评审 2.4 统一 ring）；native-tls 在 macOS 无法导入 EC PKCS#8 身份。
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls-manual-roots", "stream"] }
tokio-tungstenite = "0.24"
serial_test = "3"
tower = { version = "0.4", features = ["util"] }
bytes = "1.8"
rcgen = "0.13"
# §6.7 解析面 property 测试（安全边界解析器：XFF/CIDR、CORS Origin、header 列表、
# baggage 清洗）。选 proptest 而非 cargo-fuzz：stable 工具链、CI 友好，§6.7 原文
# "cargo-fuzz 或 quickcheck" 二选一。
proptest = "1"
# §6.4 性能验收（tensor/bytes v2）：v1(Value 往返) vs v2(&RawValue+Bytes)
# 提取器对比基准。criterion 仅用于 benches/，不进生产依赖。
criterion = "0.5"

# P-PERF-a（蓝图 §4.0.8）：perf-smoke 自含测量（reqwest+tonic 客户端，零外部
# 工具依赖）。`cargo run --release --example perf_smoke`，报告写
# target/perf-smoke.json。本地/手动测量工具，未接入 CI。
[[example]]
name = "perf_smoke"
path = "benchmarks/perf_smoke.rs"

# 流式路径 per-chunk 固定开销测量（gRPC bidi RTT + SSE/WS 逐 chunk 间隔）。
# 本地/手动测量工具，未接入 CI。
[[example]]
name = "stream_chunk_overhead"
path = "benchmarks/stream_chunk_overhead.rs"


[lib]
name = "lite_server"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "extractor_v1_vs_v2"
harness = false
