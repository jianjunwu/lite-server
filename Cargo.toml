[package]
name = "lite-server"
version = "0.7.8"
edition = "2021"

[[bin]]
name = "lite-server-core"
path = "src/main.rs"

[dependencies]
# async runtime
tokio = { version = "1.40", features = ["full", "process"] }

# HTTP framework
axum = { version = "0.7", features = ["ws", "multipart"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http = "1.0"
form_urlencoded = "1.2"

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
prost = "0.13"
prost-types = "0.13"

# version ordering for load_policy = "latest"
semver = "1.0"

# P7-1: constant-time API-key comparison (timing side-channel). Already in the
# dependency graph via rustls; pinned here as a direct dependency.
subtle = "2"
# P7-2: getuid for admin UDS owner checks (cfg unix). Already in the graph via
# tokio/mio; pinned as a direct dependency.
libc = "0.2"

# gRPC
tonic = { version = "0.12", features = ["gzip", "tls"] }
tonic-health = { version = "0.12", features = ["transport"] }
tokio-stream = { version = "0.1", features = ["net"] }

# TLS/mTLS (P5-1, 蓝图 §4.3): 统一 ring provider（评审 2.4）——axum-server 的
# tls-rustls feature 会拉 aws-lc-rs，故零 feature 引用、TLS 全部经自建
# acceptor/incoming（支持热轮换；静态 RustlsConfig/ServerTlsConfig 无法重建）。
axum-server = { version = "0.7", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
x509-parser = { version = "0.16", default-features = false }
sha2 = "0.10"

# HTTP middleware (response compression, P1-4)
tower-http = { version = "0.6", features = ["compression-gzip"] }
# Service trait for the HTTP TLS acceptor's extension-injecting wrapper (P5-1)
tower-service = "0.3"

# OpenTelemetry core only (P-MW, 蓝图 §4.0.1 评审 1.10): RequestContext.trace_cx
# 的类型载体。恒依赖、无 SDK/exporter（P-TRACE 才以 opt-in feature 引入）。
opentelemetry = { version = "0.30", default-features = false }

# transport
zmq = "0.10"

# error handling
thiserror = "2.0"
anyhow = "1.0"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# metrics
prometheus = "0.13"
lazy_static = "1.5"

# file watching
notify = { version = "6.1", default-features = false, features = ["macos_fsevent"] }

# utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1.8"
pin-project = "1.1"
dashmap = "6.1"
arc-swap = "1.7"
once_cell = "1.20"

# config
config = { version = "0.14", features = ["yaml"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# random
rand = "0.8"

# regex
regex = "1"

# base64
base64 = "0.22"

# HTTP client (for worker lifecycle hooks)
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Python interop
pyo3 = { version = "0.24", features = ["serde", "abi3-py310", "extension-module"], optional = true }
gethostname = "1.1.0"
tonic-types = "0.12"

[features]
default = []
python = ["dep:pyo3"]

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"

[dev-dependencies]
tokio-test = "0.4"
# rustls 版 HTTP 客户端（P5-1 e2e）：与服务端同一 TLS 栈 + ring provider
# （蓝图评审 2.4 统一 ring）；native-tls 在 macOS 无法导入 EC PKCS#8 身份。
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls-manual-roots"] }
tokio-tungstenite = "0.24"
serial_test = "3"
tower = { version = "0.4", features = ["util"] }
bytes = "1.8"
rcgen = "0.13"

[lib]
name = "lite_server"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
