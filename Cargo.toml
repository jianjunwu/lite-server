[package]
name = "lite-server"
version = "0.1.4"
edition = "2021"

[[bin]]
name = "lite-server-core"
path = "src/main.rs"

[dependencies]
# async runtime
tokio = { version = "1.40", features = ["full", "process"] }

# HTTP framework
axum = { version = "0.7", features = ["ws"] }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
prost = "0.13"
prost-types = "0.13"

# transport
zmq = "0.10"

# error handling
thiserror = "2.0"
anyhow = "1.0"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# metrics
prometheus = "0.13"
lazy_static = "1.5"

# file watching
notify = { version = "6.1", default-features = false, features = ["macos_fsevent"] }

# utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
bytes = "1.8"
pin-project = "1.1"
dashmap = "6.1"
arc-swap = "1.7"
once_cell = "1.20"

# config
config = { version = "0.14", features = ["yaml"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# random
rand = "0.8"

# regex
regex = "1"

# base64
base64 = "0.22"

# Python interop
pyo3 = { version = "0.24", features = ["serde", "abi3-py310", "extension-module"], optional = true }

[features]
default = []
python = ["dep:pyo3"]

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json"] }
libc = "0.2"

[lib]
name = "lite_server"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
