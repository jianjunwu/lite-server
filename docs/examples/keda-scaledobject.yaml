# KEDA ScaledObject for lite-server (see docs/keda.md / docs/zh/keda.md).
# Signal: liteserver_queue_depth (dispatch-queue backlog, per model/version).
# Constraints (D35): minReplicaCount >= 1 (no scale-to-zero); slow scale-down
# so long-lived streaming/bidi connections drain gracefully.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: lite-server
  namespace: inference
spec:
  scaleTargetRef:
    name: lite-server          # Deployment name
  minReplicaCount: 1           # D35: scale-to-zero is NOT supported
  maxReplicaCount: 10
  pollingInterval: 15          # seconds between Prometheus queries
  cooldownPeriod: 300          # slow scale-down: let in-flight streams drain
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        metricName: liteserver_queue_depth
        query: sum(liteserver_queue_depth)
        threshold: "8"         # target ~8 queued requests per replica
