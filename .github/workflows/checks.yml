name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 蓝图 §6.7 评审 2.4：依赖安全公告扫描（RUSTSEC）。
  cargo-audit:
    name: cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # `cargo audit` run directly (the deprecated rustsec/audit-check action
      # ignores ./audit.toml, and cargo-audit 0.22 doesn't auto-load it either,
      # so ignores go via --ignore flags). The 3 ignored advisories are all
      # UNREACHABLE here (verified by grep) and not fixable by a semver bump:
      #   RUSTSEC-2024-0437 protobuf 2.28 (via prometheus 0.13.4) — DoS on
      #     parsing untrusted protobuf; prometheus only SERIALIZES metrics.
      #   RUSTSEC-2026-0176 pyo3 0.24 — OOB read in nth/nth_back; no .nth()
      #     calls on list/tuple iterators in src/.
      #   RUSTSEC-2026-0177 pyo3 0.24 — missing Sync on new_closure; no
      #     new_closure/PyCFunction usage in src/.
      # pyo3 0.24→0.29 is a 5-version breaking migration, tracked separately.
      # Re-evaluate on every dependency bump. Exits non-zero only on unignored
      # vulnerabilities (unmaintained/unsound are warnings, not failures).
      - name: cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2024-0437 \
            --ignore RUSTSEC-2026-0176 \
            --ignore RUSTSEC-2026-0177

  # 蓝图 §6.3：pb2/proto 漂移检查——proto 改动必须同步重生成签入的
  # liteserver_pb2.py（regen_proto.sh 固定 grpcio-tools 1.62.x，无
  # runtime_version guard；脚本内置 guard 检查）。
  proto-drift:
    name: pb2/proto drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Regenerate pb2 and fail on drift
        run: |
          tools/regen_proto.sh
          git diff --exit-code -- python/lite_server/proto/

  # P-PERF-a（蓝图 §4.0.8）：perf-smoke informational——关键路径烟测
  # （HTTP/gRPC unary + SSE），报告上传 artifact，永不 fail。回归阈值
  # （§4.0.8 的 +10% 占位）属 P-PERF-b：需 runner 数据校准后锁定。
  perf-smoke:
    name: perf-smoke (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install protoc + libzmq (prost-build needs protoc; mirrors build-wheels Linux setup)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libzmq3-dev
      - name: Sync Python env (workers run Python; builds native ext)
        run: uv sync
      - name: Build server and perf-smoke
        run: |
          cargo build --release
          cargo build --release --example perf_smoke
      - name: Run perf-smoke
        run: uv run cargo run --release --example perf_smoke
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-report
          path: target/perf-smoke.json
          if-no-files-found: ignore
