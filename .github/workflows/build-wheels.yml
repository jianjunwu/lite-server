name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev protobuf-compiler

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zeromq

      - name: Install Miniconda and protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh
          bash /tmp/miniconda.sh -b -p "$HOME/miniconda"
          "$HOME/miniconda/bin/conda" install -y -c conda-forge libprotobuf
          echo "PROTOC=$HOME/miniconda/bin/protoc" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run Rust tests
        run: cargo test -- --test-threads=1

  cargo-test-flaky:
    name: Rust flaky tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev protobuf-compiler

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zeromq

      - name: Install Miniconda and protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh
          bash /tmp/miniconda.sh -b -p "$HOME/miniconda"
          "$HOME/miniconda/bin/conda" install -y -c conda-forge libprotobuf
          echo "PROTOC=$HOME/miniconda/bin/protoc" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run flaky tests with retries
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            if cargo test -- --test-threads=1 test_model_infer_versioned test_hot_reload; then
              echo "Passed on attempt $i"
              exit 0
            fi
            echo "Failed on attempt $i, retrying..."
            sleep 5
          done
          echo "All 3 attempts failed"
          exit 1

  # Guards the P0 "worker crashed before ready" regression: a checked-in pb2
  # generated by a new protoc (>= 26) carries a runtime_version guard that
  # binds it to a specific protobuf runtime, breaking installs whose runtime is
  # older (the 0.7.2 root cause). This asserts the guard is absent AND that the
  # gencode imports across every protobuf major we claim to support (>=5.0).
  proto-smoke:
    name: Proto gencode smoke (protobuf ${{ matrix.pb_major }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pb_major: ["5", "6", "7"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checked-in pb2 must not carry a runtime_version guard
        run: |
          if grep -q "runtime_version" python/lite_server/proto/liteserver_pb2.py; then
            echo "::error::checked-in liteserver_pb2.py contains a 'runtime_version' guard."
            echo "::error::Regenerate with tools/regen_proto.sh (pins grpcio-tools 1.62.3 / protoc 25.x — guard-free gencode)."
            exit 1
          fi
          echo "OK: no runtime_version guard in liteserver_pb2.py"

      - name: pb2 imports under protobuf ${{ matrix.pb_major }}.x
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install -q --upgrade pip
          /tmp/v/bin/pip install -q "protobuf~=${{ matrix.pb_major }}.0"
          /tmp/v/bin/python - <<'PY'
          import sys
          sys.path.insert(0, "python/lite_server/proto")
          import liteserver_pb2
          r = liteserver_pb2.Request(uid="smoke")
          assert r.uid == "smoke", "round-trip failed"
          import google.protobuf
          print("import OK under protobuf", google.protobuf.__version__)
          PY

  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version']); f.close()")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-wheels:
    needs: get-version
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: manylinux_2_28
            before-script: |
              yum install -y protobuf-compiler
              curl -fsSL -o /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
              bash /tmp/miniconda.sh -b -p /opt/miniconda
              /opt/miniconda/bin/conda install -y python=3.10
            interpreter: /opt/miniconda/bin/python3.10
          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: manylinux_2_28
            before-script: |
              apt-get update && apt-get install -y protobuf-compiler
            interpreter: python3.10
          # macOS x86_64 (disabled: macos-13 runner scarce)
          # - os: macos-13
          #   target: x86_64-apple-darwin
          #   platform: auto
          #   interpreter: python3.10
          # macOS aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: auto
            interpreter: python3.10
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: auto
            interpreter: python3.10
            vcpkg: zeromq

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows' && matrix.vcpkg
        shell: pwsh
        run: |
          vcpkg install ${{ matrix.vcpkg }}:x64-windows-static
          "LIBZMQ_PREFIX=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" >> $env:GITHUB_ENV

      - name: Install Miniconda and protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh
          bash /tmp/miniconda.sh -b -p "$HOME/miniconda"
          "$HOME/miniconda/bin/conda" install -y -c conda-forge libprotobuf
          echo "PROTOC=$HOME/miniconda/bin/protoc" >> $GITHUB_ENV

      - name: Install Miniconda and protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://repo.anaconda.com/miniconda/Miniconda3-latest-Windows-x86_64.exe" -OutFile "$env:TEMP\miniconda.exe"
          Start-Process -Wait -FilePath "$env:TEMP\miniconda.exe" -ArgumentList "/InstallationType=JustMe","/RegisterPython=0","/S","/D=$env:USERPROFILE\miniconda"
          & "$env:USERPROFILE\miniconda\Scripts\conda.exe" install -y -c conda-forge libprotobuf
          "PROTOC=$env:USERPROFILE\miniconda\Library\bin\protoc.exe" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.platform }}
          args: --release --interpreter ${{ matrix.interpreter }}
          before-script-linux: ${{ matrix.before-script }}
          docker-options: -e PROTOC=/usr/bin/protoc

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: target/wheels/*.whl

      # P0 regression guard: the freshly built wheel must install and its
      # checked-in pb2 must import under the protobuf that pip resolves
      # (catches the 0.7.2 "gencode/runtime version skew" crash at the exact
      # install path users hit). Skipped for the cross-compiled aarch64-linux
      # wheel — its arch cannot run on the x86_64 runner.
      - name: Smoke-import the built wheel (native arch only)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          python -m pip install --upgrade --force-reinstall target/wheels/*.whl
          python -c "from lite_server.proto import Request; r = Request(uid='wheel-smoke'); assert r.uid == 'wheel-smoke'; print('wheel import OK')"

  release:
    name: Release
    needs: [get-version, build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - name: Verify version matches tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION="${{ needs.get-version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Error: Tag version ($TAG) does not match pyproject.toml version ($VERSION)"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          name: lite-server v${{ needs.get-version.outputs.version }}
          files: wheels/*.whl
