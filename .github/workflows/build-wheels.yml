name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version']); f.close()")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-wheels:
    needs: get-version
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: manylinux_2_28
            before-script: |
              curl -fsSL -o /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
              bash /tmp/miniconda.sh -b -p /opt/miniconda
              /opt/miniconda/bin/conda install -y python=3.10
            interpreter: /opt/miniconda/bin/python3.10
          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: manylinux_2_28
            before-script: |
              curl -fsSL -o /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-aarch64.sh
              bash /tmp/miniconda.sh -b -p /opt/miniconda
              /opt/miniconda/bin/conda install -y python=3.10
            interpreter: /opt/miniconda/bin/python3.10
          # macOS x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            platform: auto
            interpreter: python3.10
          # macOS aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: auto
            interpreter: python3.10
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: auto
            interpreter: python3.10
          # Windows aarch64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: auto
            interpreter: python3.10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.platform }}
          args: --release --interpreter ${{ matrix.interpreter }}
          before-script-linux: ${{ matrix.before-script }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: target/wheels/*.whl

  release:
    name: Release
    needs: [get-version, build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - name: Verify version matches tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION="${{ needs.get-version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Error: Tag version ($TAG) does not match pyproject.toml version ($VERSION)"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          name: lite-server v${{ needs.get-version.outputs.version }}
          files: wheels/*.whl
