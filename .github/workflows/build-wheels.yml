name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zeromq

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Miniconda and protoc
        run: |
          curl -fsSL -o /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-$([ "$RUNNER_OS" = "macOS" ] && echo "MacOSX" || echo "Linux")-x86_64.sh
          bash /tmp/miniconda.sh -b -p /opt/miniconda
          /opt/miniconda/bin/conda install -y -c conda-forge protobuf

      - name: Install Python dependencies
        run: |
          export PATH="/opt/miniconda/bin:$PATH"
          pip install -e ".[dev]"

      - name: Run Rust tests
        run: |
          export PATH="/opt/miniconda/bin:$PATH"
          cargo test -- --test-threads=1

  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version']); f.close()")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-wheels:
    needs: get-version
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: manylinux_2_28
            before-script: |
              curl -fsSL -o /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
              bash /tmp/miniconda.sh -b -p /opt/miniconda
              /opt/miniconda/bin/conda install -y python=3.10
              /opt/miniconda/bin/conda install -y -c conda-forge protobuf
            interpreter: /opt/miniconda/bin/python3.10
          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: manylinux_2_28
            before-script: |
              curl -fsSL -o /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
              bash /tmp/miniconda.sh -b -p /opt/miniconda
              /opt/miniconda/bin/conda install -y -c conda-forge protobuf
            interpreter: python3.10
          # macOS x86_64 (disabled: macos-13 runner scarce)
          # - os: macos-13
          #   target: x86_64-apple-darwin
          #   platform: auto
          #   interpreter: python3.10
          # macOS aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: auto
            interpreter: python3.10
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: auto
            interpreter: python3.10
            vcpkg: zeromq

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows' && matrix.vcpkg
        shell: pwsh
        run: |
          vcpkg install ${{ matrix.vcpkg }}:x64-windows-static
          "LIBZMQ_PREFIX=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" >> $env:GITHUB_ENV

      - name: Install Miniconda and protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o /tmp/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-x86_64.sh
          bash /tmp/miniconda.sh -b -p /opt/miniconda
          /opt/miniconda/bin/conda install -y -c conda-forge protobuf
          echo "/opt/miniconda/bin" >> $GITHUB_PATH

      - name: Install Miniconda and protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://repo.anaconda.com/miniconda/Miniconda3-latest-Windows-x86_64.exe" -OutFile "$env:TEMP\miniconda.exe"
          Start-Process -Wait -FilePath "$env:TEMP\miniconda.exe" -ArgumentList "/InstallationType=JustMe","/RegisterPython=0","/S","/D=$env:USERPROFILE\miniconda"
          & "$env:USERPROFILE\miniconda\Scripts\conda.exe" install -y -c conda-forge protobuf
          "$env:USERPROFILE\miniconda\Scripts" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.platform }}
          args: --release --interpreter ${{ matrix.interpreter }}
          before-script-linux: ${{ matrix.before-script }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: target/wheels/*.whl

  release:
    name: Release
    needs: [get-version, build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - name: Verify version matches tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION="${{ needs.get-version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Error: Tag version ($TAG) does not match pyproject.toml version ($VERSION)"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          name: lite-server v${{ needs.get-version.outputs.version }}
          files: wheels/*.whl
