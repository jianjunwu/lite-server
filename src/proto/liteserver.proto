syntax = "proto3";
package liteserver;

// ===== Request / Response Metadata =====
message RequestMeta {
  string route = 1;
  map<string, string> headers = 2;
  string client_ip = 3;
  string request_id = 4;
  int64 timestamp_ns = 5;
  bytes payload = 6;
  // Phase 2: HTTP method / query / path params. Carried for custom routes
  // (route_call) and available to inference handlers too. Defaults: method=""
  // (worker treats empty as POST for inference), query/path_params empty.
  string method = 7;
  map<string, string> query = 8;
  map<string, string> path_params = 9;
  // P8-1 sequence_id stickiness: cross-request worker affinity hint. Carried
  // to the worker (additive) for optional KV-cache/session reuse; the server
  // uses it to bias routing. Absent = no affinity (behavior unchanged).
  optional string sequence_id = 10;
  // P-DEADLINE (蓝图 §4.0.10/§4.4): absolute per-request deadline as UNIX
  // nanoseconds. Source = client (HTTP `x-lite-timeout` rel-secs header /
  // gRPC standard `grpc-timeout` metadata), else `server.timeout` fallback.
  // The worker reads it and stops cooperatively at the deadline; the server
  // bounds unary/ensemble/streaming waits by it. Absent = no deadline
  // (behavior unchanged — e.g. no client spec AND server.timeout<=0).
  optional int64 deadline_unix_ns = 11;
}

// ===== Request Payloads =====
message Request {
  string uid = 1;
  RequestMeta meta = 2;
  oneof payload {
    SingleRequest single = 10;
    BatchRequest batch = 11;
    // Custom @route invocation: reuses the SingleRequest body type; the
    // route_call tag discriminates dispatch in the worker (run_route vs
    // run_single). Route pattern / method / query / path_params live on
    // RequestMeta; HTTP headers ride the outer meta as for inference.
    SingleRequest route_call = 12;
    // Hot reload: notify a live worker that files in its model version
    // directory changed. The worker dispatches to the model's
    // LitAPI.on_file_changed hook and replies with a SingleResponse whose
    // data is {"handled": bool}. handled=false — or any error/timeout,
    // including a pre-FILE_CHANGED worker replying "Unsupported payload
    // type" — makes the server fall back to a full worker restart.
    FileChangedRequest file_changed = 13;
    CBAddRequest cb_add = 20;
    CBRemoveRequest cb_remove = 21;
    // Graceful stop: the server signals the worker to break its recv loop,
    // run the teardown path (_run_teardown: LitAPI.teardown + lifecycle
    // callbacks), and exit cleanly. Sent on unload/respawn BEFORE the
    // SIGKILL fallback (worker_kill_timeout). The worker does NOT reply —
    // the monitor observes the natural process exit instead. A hung worker
    // that never reads this message is SIGKILLed after the timeout.
    StopRequest stop = 22;
    StreamRequest stream = 30;
  }
}

// Graceful-stop control message. See Request.stop for the contract.
message StopRequest {}

message SingleRequest {
  bytes data = 1;
}

message BatchRequest {
  repeated BatchItem items = 1;
}

message BatchItem {
  string uid = 1;
  bytes data = 2;
}

// Hot reload notification: absolute paths of changed files inside one model
// version directory. See Request.file_changed for the handling contract.
message FileChangedRequest {
  repeated string paths = 1;
}

// Continuous Batching
message CBAddRequest {
  string uid = 1;
  bytes data = 2;
  RequestMeta meta = 3;
}

message CBRemoveRequest {
  string uid = 1;
}

// ===== Stream Request =====
message StreamRequest {
  string stream_id = 1;
  oneof action {
    StreamOpen open = 2;
    StreamChunk chunk = 3;
    StreamClose close = 4;
    StreamCancel cancel = 5;
  }
}

message StreamOpen {
  bytes data = 1;
  RequestMeta meta = 2;
  // P9-1 DecoupledInfer: when true, the worker must NOT emit StreamDone when
  // its predict_decoupled() returns — the model holds the ResponseSender and
  // pushes N chunks asynchronously, ending the stream with an explicit
  // close() (or the server reclaims it via idle timeout / client cancel).
  // Additive: absent/false = existing stream_predict semantics (unchanged).
  optional bool decoupled = 3;
}

message StreamChunk {
  bytes data = 1;
}

message StreamClose {
}

message StreamCancel {
  // Why the stream is being cancelled (e.g. "client_disconnect",
  // "idle_timeout", "deadline", "panic", "shutdown", "recycle").
  // Informational; absent = legacy hard cancel.
  optional string reason = 1;
  // Grace window in milliseconds before the worker hard-cancels the
  // stream (reason "recycle" from the rolling-recycle eviction path).
  // Within the window the model may keep pushing and close() itself —
  // the client then sees a normal Done instead of an eviction error.
  // 0 / absent = immediate cancel (legacy behavior).
  optional uint32 grace_ms = 2;
}

// ===== Response Payloads =====
message Response {
  string uid = 1;
  Metrics metrics = 40;
  oneof payload {
    SingleResponse single = 10;
    BatchResponse batch = 11;
    CBCompletedResponse cb_completed = 20;
    StreamResponse stream = 30;
  }
}

message SingleResponse {
  bytes data = 1;
  Status status = 2;
  map<string, string> headers = 3;
  int32 status_code = 4;
  string media_type = 5;
}

message BatchResponse {
  repeated BatchItemResponse items = 1;
  // Deprecated: retained for wire compatibility, no longer populated.
  // Per-item status/status_code/media_type/headers live on BatchItemResponse.
  map<string, string> headers = 2;
}

message BatchItemResponse {
  string uid = 1;
  bytes data = 2;
  Status status = 3;
  int32 status_code = 4;
  string media_type = 5;
  map<string, string> headers = 6;
}

message CBCompletedResponse {
  repeated CompletedSequence sequences = 1;
}

message CompletedSequence {
  string uid = 1;
  bytes data = 2;
}

// ===== Stream Response =====
message StreamResponse {
  string stream_id = 1;
  oneof payload {
    StreamChunkResponse chunk = 2;
    StreamDone done = 3;
    StreamError error = 4;
    // First frame of a streaming @route reply: carries the handler-chosen
    // HTTP metadata. Only custom routes emit it; inference streams start
    // directly with chunk frames.
    StreamStart start = 5;
  }
}

message StreamChunkResponse {
  bytes data = 1;
  bool is_final = 2;
}

message StreamDone {
  Metrics metrics = 1;
}

message StreamStart {
  int32 status_code = 1;
  string media_type = 2;
  map<string, string> headers = 3;
}

message StreamError {
  string message = 1;
}

// code describes worker *execution* state ("Ok" = the pipeline completed
// normally, "Error" = an exception / worker failure).  The HTTP status of a
// successful response travels separately in SingleResponse.status_code /
// BatchItemResponse.status_code — an "Ok" Status may still carry a 4xx/5xx
// status_code (e.g. early return with Response(status_code=400)).
message Status {
  string code = 1;
  string message = 2;
}

message MetricValue {
  int32 id = 1;
  float value = 2;
}

message Metrics {
  float prefill_ms = 1;
  float decode_ms = 2;
  int32 tokens_generated = 3;
  repeated MetricValue gauges = 4;
  repeated MetricValue counters = 5;
  repeated MetricValue histograms = 6;
}

// ===== gRPC Service =====
service LiteServer {
  rpc Infer(InferRequest) returns (InferResponse);
  rpc BatchInfer(BatchInferRequest) returns (BatchInferResponse);
  rpc StreamInfer(StreamInferRequest) returns (stream StreamChunk);
  rpc BidiStream(stream BidiChunk) returns (stream BidiChunk);
  // P9-1 (蓝图 §4.4, D18): one request → worker pushes N async responses
  // over a long-lived channel whose lifetime the model controls (returns
  // before close). Reuses the ZMQ stream mechanism with StreamOpen.decoupled.
  rpc DecoupledInfer(DecoupledInferRequest) returns (stream DecoupledResponse);
}

message InferRequest {
  string model_name = 1;
  string version = 2;
  bytes data = 3;
  map<string, string> headers = 4;
  optional string sequence_id = 5;
}

message InferResponse {
  bytes data = 1;
  Status status = 2;
  Metrics metrics = 3;
}

message BatchInferRequest {
  string model_name = 1;
  string version = 2;
  repeated bytes items = 3;
  map<string, string> headers = 4;
}

message BatchInferResponse {
  repeated InferResponse items = 1;
}

message StreamInferRequest {
  string model_name = 1;
  string version = 2;
  bytes data = 3;
  map<string, string> headers = 4;
  optional string sequence_id = 5;
}

message BidiChunk {
  string stream_id = 1;
  oneof payload {
    BidiOpen open = 2;
    BidiData data = 3;
    BidiClose close = 4;
    // h2 bidi: worker Error is delivered as an in-band error frame (h2 has no
    // trailing status). Additive — gRPC/ZMQ wire backward-compatible.
    BidiError error = 5;
  }
}

message BidiOpen {
  string model_name = 1;
  string version = 2;
  bytes initial_data = 3;
  optional string sequence_id = 4;
  // B3 hint + canary/auth carrier (parity with StreamInferRequest.headers).
  // Field number 5 (not 4) because BidiOpen already has sequence_id=4; the
  // ordering is intentionally reversed vs the sibling streaming messages
  // (which use headers=4, sequence_id=5) to keep the additive field
  // wire-compatible. gRPC-only — the ZMQ wire uses StreamOpen + RequestMeta.
  map<string, string> headers = 5;
}

message BidiData {
  bytes data = 1;
}

message BidiClose {
}

message BidiError {
  string message = 1;
  // Structured error type (aligns with model_error_status type field).
  string error_type = 2;
}

// P9-1 DecoupledInfer (蓝图 §4.4). gRPC-only messages — the worker never sees
// these; it speaks the ZMQ stream protocol (StreamOpen{decoupled=true} +
// StreamChunkResponse + StreamDone). The Rust handler translates between them.
message DecoupledInferRequest {
  string model_name = 1;
  string version = 2;
  bytes data = 3;
  map<string, string> headers = 4;
  optional string sequence_id = 5;   // P8-1 联动：粘性路由 hint
}

message DecoupledResponse {
  bytes data = 1;
  // true on the terminal frame (model called sender.close()); the stream ends
  // after it. Non-terminal chunks carry the pushed payload.
  bool is_final = 2;
}

// ===== Admin Service (P6, 蓝图 §4.1) =====
//
// 18 RPCs mirroring the HTTP admin REST surface. Additive ONLY: a new service
// and new messages; no existing message/field is touched (proto 双用途 gRPC+ZMQ，
// additive 对 ZMQ wire 向后安全). gRPC reflection (评审低#12) 已实现：opt-in
// 配置 `grpc.reflection: true`（默认关），见 src/grpc/reflection.rs。
service Admin {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc ModelReady(ModelReadyRequest) returns (ModelReadyResponse);
  rpc ModelHealth(ModelHealthRequest) returns (ModelHealthResponse);
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);
  rpc UnloadModel(UnloadModelRequest) returns (UnloadModelResponse);
  rpc ReloadModel(ReloadModelRequest) returns (ReloadModelResponse);
  rpc ActivateVersion(ActivateVersionRequest) returns (ActivateVersionResponse);
  rpc SetRouting(SetRoutingRequest) returns (SetRoutingResponse);
  rpc GetModelStats(GetModelStatsRequest) returns (GetModelStatsResponse);
  // Repository lifecycle (model-upload-and-retire plan: G3 + E5 + F3) —
  // delete/drift parity with the HTTP endpoints of the same name, plus
  // file transfer RPCs. Additive-only, same as the P6 block above.
  rpc DeleteVersion(DeleteVersionRequest) returns (DeleteVersionResponse);
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);
  rpc DeleteVersions(DeleteVersionsRequest) returns (DeleteVersionsResponse);
  rpc RepositoryDrift(RepositoryDriftRequest) returns (RepositoryDriftResponse);
  rpc UploadModel(stream UploadModelRequest) returns (UploadModelResponse);
  rpc DownloadModel(DownloadModelRequest) returns (stream DownloadModelChunk);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // M1 (admin-enhancement plan): model version config read — mirrors
  // GET /v2/models/:m/versions/:v/config. Additive-only.
  rpc GetModelConfig(GetModelConfigRequest) returns (GetModelConfigResponse);
  // M2: model version config write — mirrors
  // PATCH /v2/models/:m/versions/:v/config. Additive-only.
  rpc UpdateModelConfig(UpdateModelConfigRequest) returns (UpdateModelConfigResponse);
}

// --- GetInfo (mirrors GET /info) ---
message GetInfoRequest {}
message GetInfoResponse {
  string server = 1;                       // "lite-server"
  string version = 2;                      // CARGO_PKG_VERSION
  repeated string loaded_models = 3;       // "name/version" per loaded version
}

// --- ListModels (mirrors GET /v2/models) ---
message ListModelsRequest {}
message ListModelsResponse {
  repeated ModelSummary models = 1;
}
message ModelSummary {
  string name = 1;
  string version = 2;
  string status = 3;                       // VersionStatus snake_case (ready/degraded/...)
  string model_type = 4;                   // {:?} Debug: "LitAPI" | "Ensemble"
  uint32 workers = 5;                      // mv.workers.len()
}

// --- ListVersions (mirrors GET /v2/models/:m/versions) ---
message ListVersionsRequest {
  string model_name = 1;
}
message ListVersionsResponse {
  string name = 1;
  optional string active_version = 2;      // absent when no active version
  repeated VersionSummary versions = 3;
}
message VersionSummary {
  string version = 1;
  string status = 2;                       // VersionStatus snake_case
  bool active = 3;
  uint32 weight = 4;
  uint32 ready_workers = 5;
  uint32 total_workers = 6;
  optional uint64 loaded_at = 7;           // epoch seconds; absent when None
}

// --- ModelReady (mirrors GET /v2/models/:m[/versions/:v]/ready) ---
message ModelReadyRequest {
  string model_name = 1;
  optional string version = 2;             // absent → active version
}
message ModelReadyResponse {
  string name = 1;
  optional string version = 2;             // the version queried (active when request omitted)
  bool ready = 3;
  optional string active_version = 4;
}

// --- ModelHealth (mirrors GET /v2/models/:m[/versions/:v]/health) ---
message ModelHealthRequest {
  string model_name = 1;
  optional string version = 2;             // absent → router-resolved version
}
message ModelHealthResponse {
  string name = 1;
  string version = 2;
  uint32 healthy_workers = 3;
  uint32 total_workers = 4;
  repeated WorkerHealth workers = 5;
}
message WorkerHealth {
  uint32 worker_id = 1;
  bool healthy = 2;
  bool ejected = 3;
}

// --- Load / Unload / Reload (mirror POST /v2/repository/...) ---
message LoadModelRequest {
  string model_name = 1;
  string version = 2;
}
message LoadModelResponse {
  bool success = 1;
  string message = 2;
}
message UnloadModelRequest {
  string model_name = 1;
  optional string version = 2;             // absent → active version
}
message UnloadModelResponse {
  bool success = 1;
  string message = 2;
}
message ReloadModelRequest {
  string model_name = 1;
  optional string version = 2;             // absent → active version
}
message ReloadModelResponse {
  bool success = 1;
  string message = 2;
}

// --- ActivateVersion (mirrors POST /v2/models/:m/versions/:v/activate) ---
message ActivateVersionRequest {
  string model_name = 1;
  string version = 2;
}
message ActivateVersionResponse {
  bool success = 1;
  string message = 2;
  string active_version = 3;
}

// --- SetRouting (mirrors PUT /v2/models/:m/routing + P5-2 canary 糖) ---
message SetRoutingRequest {
  string model_name = 1;
  // Primary: explicit per-version weights (mirrors HTTP). Versions not listed
  // get weight 0.
  map<string, uint32> weights = 2;
  // P5-2 canary 糖 (蓝图 §4.4, 随 P6 实施): declare a canary split; the server
  // converts it into weights — canary_percent → canary_version, the remainder
  // (100 - canary_percent) → the currently active version. Mutually exclusive
  // with `weights` (setting both → INVALID_ARGUMENT).
  optional string canary_version = 3;
  optional uint32 canary_percent = 4;
}
message SetRoutingResponse {
  bool success = 1;
  map<string, uint32> weights = 2;         // effective weights applied
}

// --- GetModelStats (assembled from prometheus counters + queue depth; no HTTP twin) ---
message GetModelStatsRequest {
  string model_name = 1;
  optional string version = 2;             // absent → all loaded versions of the model
}
message GetModelStatsResponse {
  repeated ModelStats stats = 1;
}
message ModelStats {
  string model = 1;
  string version = 2;
  uint64 inference_count = 3;              // Σ REQUESTS_TOTAL across status families
  double avg_duration_ms = 4;              // REQUEST_DURATION sum/count (0 when no samples)
  int64 queue_depth = 5;                   // QUEUE_DEPTH gauge
  repeated WorkerStats workers = 6;
}
message WorkerStats {
  uint32 worker_id = 1;
  bool healthy = 2;                        // !OutlierState::is_ejected
  uint64 inference_count = 3;              // WORKER_INFERENCE_TOTAL{...,worker_id}
}

// --- DeleteVersion (mirrors DELETE /v2/models/:m/versions/:v) ---
message DeleteVersionRequest {
  string model_name = 1;
  string version = 2;
  // E3 protection: deleting the active version requires force=true (HTTP
  // `?force=`); the unforced call fails with FAILED_PRECONDITION.
  bool force = 3;
}
message DeleteVersionResponse {
  bool success = 1;
  string message = 2;
}

// --- DeleteModel (mirrors DELETE /v2/models/:m) ---
message DeleteModelRequest {
  string model_name = 1;
  bool force = 2;                          // required while an active version exists
}
message DeleteModelResponse {
  bool success = 1;
  string message = 2;
}

// --- DeleteVersions (mirrors DELETE /v2/models/:m/versions) ---
message DeleteVersionsRequest {
  string model_name = 1;
  // Retain the N highest versions (lenient semver, unparseable = lowest).
  // 0 = unset; exclusive with `versions`.
  optional uint32 keep = 2;
  // Explicit version list. Exclusive with `keep`.
  repeated string versions = 3;
  bool force = 4;                          // required for active versions in scope
}
message DeleteVersionsResponse {
  repeated string deleted = 1;
  // Partial-failure semantics (same as HTTP): per-version failures are
  // reported here instead of failing the whole RPC.
  repeated DeleteFailure failed = 2;
}
message DeleteFailure {
  string version = 1;
  string error = 2;
}

// --- RepositoryDrift (mirrors GET /v2/repository/drift) ---
message RepositoryDriftRequest {
  // Absent → whole repository (HTTP behavior); present → single model.
  optional string model_name = 1;
}
message RepositoryDriftResponse {
  repeated DriftMissingEntry configured_missing = 1;
  repeated DriftDiskEntry on_disk_unconfigured = 2;
}
message DriftMissingEntry {
  string model = 1;
  string version = 2;
}
message DriftDiskEntry {
  string model = 1;
  string version = 2;
  uint64 size_bytes = 3;                   // recursive directory size
  bool ensemble_referenced = 4;            // referenced by any ensemble chain node
}

// --- UploadModel (client-streaming; mirrors the HTTP upload endpoints) ---
//
// Loose-field wire (定稿 2026-08-13): the FIRST message carries the request
// metadata (model_name / optional version / optional load); every subsequent
// message carries file content (file_name + data). A large file is sent as
// multiple messages sharing one file_name.
message UploadModelRequest {
  // Metadata — first message only.
  string model_name = 1;
  // Absent → model-level upload (F8): a single .lma, version read from the
  // package manifest. Present → versioned upload (raw files or one .lma).
  optional string version = 2;
  // Aligns with HTTP `?load=` (default true there). Absent → true.
  optional bool load = 3;
  // File content — subsequent messages.
  string file_name = 4;
  bytes data = 5;
}
message UploadModelResponse {
  bool success = 1;
  string model = 2;
  string version = 3;
  repeated string files = 4;
  // Mirrors HTTP `loaded`: the real outcome of the post-upload auto-load
  // (true only when a load was requested AND succeeded).
  bool loaded = 5;
  optional string load_error = 6;
}

// --- DownloadModel (server-streaming; mirrors GET .../download) ---
message DownloadModelRequest {
  string model_name = 1;
  // Absent → active version (F9, same as bare ready).
  optional string version = 2;
  // Single-file download; absent → whole directory as one .lma (original
  // artifact passthrough when one exists, else a fresh pack).
  optional string file = 3;
}
// DecoupledResponse-style terminal frame (proto 定稿): the stream ends with
// a final chunk carrying the sha256 (hex) and total size of the assembled
// payload; data is empty there. Non-terminal chunks are 1 MiB max.
message DownloadModelChunk {
  bytes data = 1;
  bool is_final = 2;
  string sha256 = 3;
  uint64 size = 4;
}

// --- ListFiles (mirrors GET /v2/repository/models/:m/versions/:v/files) ---
message ListFilesRequest {
  string model_name = 1;
  string version = 2;
}
message ListFilesResponse {
  string model = 1;
  string version = 2;
  repeated FileEntry files = 3;
}
message FileEntry {
  string name = 1;
  uint64 size = 2;
  // Epoch seconds; absent when unreadable (HTTP JSON emits null there).
  optional uint64 modified = 3;
  bool is_dir = 4;
}

// --- GetModelConfig (mirrors GET /v2/models/:m/versions/:v/config, M1) ---
message GetModelConfigRequest {
  string model_name = 1;
  string version = 2;
}
message GetModelConfigResponse {
  string model = 1;
  string version = 2;
  string config_json = 3;                // redacted file tree, JSON-encoded
  bool has_file = 4;                     // false when the version has no config.yaml
  repeated string redacted = 5;          // dot-joined redacted paths
  optional string etag = 6;              // content SHA-256 (16 hex); absent without file
  optional uint64 loaded_at = 7;         // epoch seconds; absent when not loaded
}

// --- UpdateModelConfig (mirrors PATCH /v2/models/:m/versions/:v/config, M2) ---
message UpdateModelConfigRequest {
  string model_name = 1;
  string version = 2;
  string patch_json = 3;                 // RFC 7386 merge-patch, JSON-encoded
  optional string if_match = 4;          // etag precondition from the last read
  bool force = 5;                        // bypass the etag precondition
  string mode = 6;                       // apply_reload | write_only | dry_run (empty = apply_reload)
}
message UpdateModelConfigResponse {
  bool valid = 1;                        // false only for dry_run of an invalid merge
  bool written = 2;                      // false for dry_run
  bool reloaded = 3;
  optional string etag = 4;              // new content etag after write; current etag for dry_run
  repeated string warnings = 5;          // unknown keys, not-applied hints, validation detail
}
