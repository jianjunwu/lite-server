syntax = "proto3";
package liteserver;

// ===== Request / Response Metadata =====
message RequestMeta {
  string route = 1;
  map<string, string> headers = 2;
  string client_ip = 3;
  string request_id = 4;
  int64 timestamp_ns = 5;
  bytes payload = 6;
  // Phase 2: HTTP method / query / path params. Carried for custom routes
  // (route_call) and available to inference handlers too. Defaults: method=""
  // (worker treats empty as POST for inference), query/path_params empty.
  string method = 7;
  map<string, string> query = 8;
  map<string, string> path_params = 9;
}

// ===== Request Payloads =====
message Request {
  string uid = 1;
  RequestMeta meta = 2;
  oneof payload {
    SingleRequest single = 10;
    BatchRequest batch = 11;
    // Custom @route invocation: reuses the SingleRequest body type; the
    // route_call tag discriminates dispatch in the worker (run_route vs
    // run_single). Route pattern / method / query / path_params live on
    // RequestMeta; HTTP headers ride the outer meta as for inference.
    SingleRequest route_call = 12;
    // Hot reload: notify a live worker that files in its model version
    // directory changed. The worker dispatches to the model's
    // LitAPI.on_file_changed hook and replies with a SingleResponse whose
    // data is {"handled": bool}. handled=false — or any error/timeout,
    // including a pre-FILE_CHANGED worker replying "Unsupported payload
    // type" — makes the server fall back to a full worker restart.
    FileChangedRequest file_changed = 13;
    CBAddRequest cb_add = 20;
    CBRemoveRequest cb_remove = 21;
    StreamRequest stream = 30;
  }
}

message SingleRequest {
  bytes data = 1;
}

message BatchRequest {
  repeated BatchItem items = 1;
}

message BatchItem {
  string uid = 1;
  bytes data = 2;
}

// Hot reload notification: absolute paths of changed files inside one model
// version directory. See Request.file_changed for the handling contract.
message FileChangedRequest {
  repeated string paths = 1;
}

// Continuous Batching
message CBAddRequest {
  string uid = 1;
  bytes data = 2;
  RequestMeta meta = 3;
}

message CBRemoveRequest {
  string uid = 1;
}

// ===== Stream Request =====
message StreamRequest {
  string stream_id = 1;
  oneof action {
    StreamOpen open = 2;
    StreamChunk chunk = 3;
    StreamClose close = 4;
    StreamCancel cancel = 5;
  }
}

message StreamOpen {
  bytes data = 1;
  RequestMeta meta = 2;
}

message StreamChunk {
  bytes data = 1;
}

message StreamClose {
}

message StreamCancel {
}

// ===== Response Payloads =====
message Response {
  string uid = 1;
  Metrics metrics = 40;
  oneof payload {
    SingleResponse single = 10;
    BatchResponse batch = 11;
    CBCompletedResponse cb_completed = 20;
    StreamResponse stream = 30;
  }
}

message SingleResponse {
  bytes data = 1;
  Status status = 2;
  map<string, string> headers = 3;
  int32 status_code = 4;
  string media_type = 5;
}

message BatchResponse {
  repeated BatchItemResponse items = 1;
  // Deprecated: retained for wire compatibility, no longer populated.
  // Per-item status/status_code/media_type/headers live on BatchItemResponse.
  map<string, string> headers = 2;
}

message BatchItemResponse {
  string uid = 1;
  bytes data = 2;
  Status status = 3;
  int32 status_code = 4;
  string media_type = 5;
  map<string, string> headers = 6;
}

message CBCompletedResponse {
  repeated CompletedSequence sequences = 1;
}

message CompletedSequence {
  string uid = 1;
  bytes data = 2;
}

// ===== Stream Response =====
message StreamResponse {
  string stream_id = 1;
  oneof payload {
    StreamChunkResponse chunk = 2;
    StreamDone done = 3;
    StreamError error = 4;
    // First frame of a streaming @route reply: carries the handler-chosen
    // HTTP metadata. Only custom routes emit it; inference streams start
    // directly with chunk frames.
    StreamStart start = 5;
  }
}

message StreamChunkResponse {
  bytes data = 1;
  bool is_final = 2;
}

message StreamDone {
  Metrics metrics = 1;
}

message StreamStart {
  int32 status_code = 1;
  string media_type = 2;
  map<string, string> headers = 3;
}

message StreamError {
  string message = 1;
}

// code describes worker *execution* state ("Ok" = the pipeline completed
// normally, "Error" = an exception / worker failure).  The HTTP status of a
// successful response travels separately in SingleResponse.status_code /
// BatchItemResponse.status_code — an "Ok" Status may still carry a 4xx/5xx
// status_code (e.g. early return with Response(status_code=400)).
message Status {
  string code = 1;
  string message = 2;
}

message MetricValue {
  int32 id = 1;
  float value = 2;
}

message Metrics {
  float prefill_ms = 1;
  float decode_ms = 2;
  int32 tokens_generated = 3;
  repeated MetricValue gauges = 4;
  repeated MetricValue counters = 5;
  repeated MetricValue histograms = 6;
}

// ===== gRPC Service =====
service LiteServer {
  rpc Infer(InferRequest) returns (InferResponse);
  rpc BatchInfer(BatchInferRequest) returns (BatchInferResponse);
  rpc StreamInfer(StreamInferRequest) returns (stream StreamChunk);
  rpc BidiStream(stream BidiChunk) returns (stream BidiChunk);
}

message InferRequest {
  string model_name = 1;
  string version = 2;
  bytes data = 3;
  map<string, string> headers = 4;
}

message InferResponse {
  bytes data = 1;
  Status status = 2;
  Metrics metrics = 3;
}

message BatchInferRequest {
  string model_name = 1;
  string version = 2;
  repeated bytes items = 3;
  map<string, string> headers = 4;
}

message BatchInferResponse {
  repeated InferResponse items = 1;
}

message StreamInferRequest {
  string model_name = 1;
  string version = 2;
  bytes data = 3;
  map<string, string> headers = 4;
}

message BidiChunk {
  string stream_id = 1;
  oneof payload {
    BidiOpen open = 2;
    BidiData data = 3;
    BidiClose close = 4;
  }
}

message BidiOpen {
  string model_name = 1;
  string version = 2;
  bytes initial_data = 3;
}

message BidiData {
  bytes data = 1;
}

message BidiClose {
}

// ===== Admin Service (P6, 蓝图 §4.1) =====
//
// 11 RPCs mirroring the HTTP admin REST surface. Additive ONLY: a new service
// + new messages; no existing message/field is touched (proto 双用途 gRPC+ZMQ，
// additive 对 ZMQ wire 向后安全). gRPC reflection (评审低#12) is an opt-in
// follow-up, not included here.
service Admin {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc ModelReady(ModelReadyRequest) returns (ModelReadyResponse);
  rpc ModelHealth(ModelHealthRequest) returns (ModelHealthResponse);
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);
  rpc UnloadModel(UnloadModelRequest) returns (UnloadModelResponse);
  rpc ReloadModel(ReloadModelRequest) returns (ReloadModelResponse);
  rpc ActivateVersion(ActivateVersionRequest) returns (ActivateVersionResponse);
  rpc SetRouting(SetRoutingRequest) returns (SetRoutingResponse);
  rpc GetModelStats(GetModelStatsRequest) returns (GetModelStatsResponse);
}

// --- GetInfo (mirrors GET /info) ---
message GetInfoRequest {}
message GetInfoResponse {
  string server = 1;                       // "lite-server"
  string version = 2;                      // CARGO_PKG_VERSION
  repeated string loaded_models = 3;       // "name/version" per loaded version
}

// --- ListModels (mirrors GET /v2/models) ---
message ListModelsRequest {}
message ListModelsResponse {
  repeated ModelSummary models = 1;
}
message ModelSummary {
  string name = 1;
  string version = 2;
  string status = 3;                       // VersionStatus snake_case (ready/degraded/...)
  string model_type = 4;                   // {:?} Debug: "LitAPI" | "Ensemble"
  uint32 workers = 5;                      // mv.workers.len()
}

// --- ListVersions (mirrors GET /v2/models/:m/versions) ---
message ListVersionsRequest {
  string model_name = 1;
}
message ListVersionsResponse {
  string name = 1;
  optional string active_version = 2;      // absent when no active version
  repeated VersionSummary versions = 3;
}
message VersionSummary {
  string version = 1;
  string status = 2;                       // VersionStatus snake_case
  bool active = 3;
  uint32 weight = 4;
  uint32 ready_workers = 5;
  uint32 total_workers = 6;
  optional uint64 loaded_at = 7;           // epoch seconds; absent when None
}

// --- ModelReady (mirrors GET /v2/models/:m[/versions/:v]/ready) ---
message ModelReadyRequest {
  string model_name = 1;
  optional string version = 2;             // absent → active version
}
message ModelReadyResponse {
  string name = 1;
  optional string version = 2;             // the version queried (active when request omitted)
  bool ready = 3;
  optional string active_version = 4;
}

// --- ModelHealth (mirrors GET /v2/models/:m[/versions/:v]/health) ---
message ModelHealthRequest {
  string model_name = 1;
  optional string version = 2;             // absent → router-resolved version
}
message ModelHealthResponse {
  string name = 1;
  string version = 2;
  uint32 healthy_workers = 3;
  uint32 total_workers = 4;
  repeated WorkerHealth workers = 5;
}
message WorkerHealth {
  uint32 worker_id = 1;
  bool healthy = 2;
  bool ejected = 3;
}

// --- Load / Unload / Reload (mirror POST /v2/repository/...) ---
message LoadModelRequest {
  string model_name = 1;
  string version = 2;
}
message LoadModelResponse {
  bool success = 1;
  string message = 2;
}
message UnloadModelRequest {
  string model_name = 1;
  optional string version = 2;             // absent → active version
}
message UnloadModelResponse {
  bool success = 1;
  string message = 2;
}
message ReloadModelRequest {
  string model_name = 1;
  optional string version = 2;             // absent → active version
}
message ReloadModelResponse {
  bool success = 1;
  string message = 2;
}

// --- ActivateVersion (mirrors POST /v2/models/:m/versions/:v/activate) ---
message ActivateVersionRequest {
  string model_name = 1;
  string version = 2;
}
message ActivateVersionResponse {
  bool success = 1;
  string message = 2;
  string active_version = 3;
}

// --- SetRouting (mirrors PUT /v2/models/:m/routing + P5-2 canary 糖) ---
message SetRoutingRequest {
  string model_name = 1;
  // Primary: explicit per-version weights (mirrors HTTP). Versions not listed
  // get weight 0.
  map<string, uint32> weights = 2;
  // P5-2 canary 糖 (蓝图 §4.4, 随 P6 实施): declare a canary split; the server
  // converts it into weights — canary_percent → canary_version, the remainder
  // (100 - canary_percent) → the currently active version. Mutually exclusive
  // with `weights` (setting both → INVALID_ARGUMENT).
  optional string canary_version = 3;
  optional uint32 canary_percent = 4;
}
message SetRoutingResponse {
  bool success = 1;
  map<string, uint32> weights = 2;         // effective weights applied
}

// --- GetModelStats (assembled from prometheus counters + queue depth; no HTTP twin) ---
message GetModelStatsRequest {
  string model_name = 1;
  optional string version = 2;             // absent → all loaded versions of the model
}
message GetModelStatsResponse {
  repeated ModelStats stats = 1;
}
message ModelStats {
  string model = 1;
  string version = 2;
  uint64 inference_count = 3;              // Σ REQUESTS_TOTAL across status families
  double avg_duration_ms = 4;              // REQUEST_DURATION sum/count (0 when no samples)
  int64 queue_depth = 5;                   // QUEUE_DEPTH gauge
  repeated WorkerStats workers = 6;
}
message WorkerStats {
  uint32 worker_id = 1;
  bool healthy = 2;                        // !OutlierState::is_ejected
  uint64 inference_count = 3;              // WORKER_INFERENCE_TOTAL{...,worker_id}
}
