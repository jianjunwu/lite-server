syntax = "proto3";
package liteserver;

// ===== Request / Response Metadata =====
message RequestMeta {
  string route = 1;
  map<string, string> headers = 2;
  string client_ip = 3;
  string request_id = 4;
  int64 timestamp_ns = 5;
  bytes payload = 6;
  // Phase 2: HTTP method / query / path params. Carried for custom routes
  // (route_call) and available to inference handlers too. Defaults: method=""
  // (worker treats empty as POST for inference), query/path_params empty.
  string method = 7;
  map<string, string> query = 8;
  map<string, string> path_params = 9;
}

// ===== Request Payloads =====
message Request {
  string uid = 1;
  RequestMeta meta = 2;
  oneof payload {
    SingleRequest single = 10;
    BatchRequest batch = 11;
    // Custom @route invocation: reuses the SingleRequest body type; the
    // route_call tag discriminates dispatch in the worker (run_route vs
    // run_single). Route pattern / method / query / path_params live on
    // RequestMeta; HTTP headers ride the outer meta as for inference.
    SingleRequest route_call = 12;
    // Hot reload: notify a live worker that files in its model version
    // directory changed. The worker dispatches to the model's
    // LitAPI.on_file_changed hook and replies with a SingleResponse whose
    // data is {"handled": bool}. handled=false — or any error/timeout,
    // including a pre-FILE_CHANGED worker replying "Unsupported payload
    // type" — makes the server fall back to a full worker restart.
    FileChangedRequest file_changed = 13;
    CBAddRequest cb_add = 20;
    CBRemoveRequest cb_remove = 21;
    StreamRequest stream = 30;
  }
}

message SingleRequest {
  bytes data = 1;
}

message BatchRequest {
  repeated BatchItem items = 1;
}

message BatchItem {
  string uid = 1;
  bytes data = 2;
}

// Hot reload notification: absolute paths of changed files inside one model
// version directory. See Request.file_changed for the handling contract.
message FileChangedRequest {
  repeated string paths = 1;
}

// Continuous Batching
message CBAddRequest {
  string uid = 1;
  bytes data = 2;
  RequestMeta meta = 3;
}

message CBRemoveRequest {
  string uid = 1;
}

// ===== Stream Request =====
message StreamRequest {
  string stream_id = 1;
  oneof action {
    StreamOpen open = 2;
    StreamChunk chunk = 3;
    StreamClose close = 4;
    StreamCancel cancel = 5;
  }
}

message StreamOpen {
  bytes data = 1;
  RequestMeta meta = 2;
}

message StreamChunk {
  bytes data = 1;
}

message StreamClose {
}

message StreamCancel {
}

// ===== Response Payloads =====
message Response {
  string uid = 1;
  Metrics metrics = 40;
  oneof payload {
    SingleResponse single = 10;
    BatchResponse batch = 11;
    CBCompletedResponse cb_completed = 20;
    StreamResponse stream = 30;
  }
}

message SingleResponse {
  bytes data = 1;
  Status status = 2;
  map<string, string> headers = 3;
  int32 status_code = 4;
  string media_type = 5;
}

message BatchResponse {
  repeated BatchItemResponse items = 1;
  // Deprecated: retained for wire compatibility, no longer populated.
  // Per-item status/status_code/media_type/headers live on BatchItemResponse.
  map<string, string> headers = 2;
}

message BatchItemResponse {
  string uid = 1;
  bytes data = 2;
  Status status = 3;
  int32 status_code = 4;
  string media_type = 5;
  map<string, string> headers = 6;
}

message CBCompletedResponse {
  repeated CompletedSequence sequences = 1;
}

message CompletedSequence {
  string uid = 1;
  bytes data = 2;
}

// ===== Stream Response =====
message StreamResponse {
  string stream_id = 1;
  oneof payload {
    StreamChunkResponse chunk = 2;
    StreamDone done = 3;
    StreamError error = 4;
    // First frame of a streaming @route reply: carries the handler-chosen
    // HTTP metadata. Only custom routes emit it; inference streams start
    // directly with chunk frames.
    StreamStart start = 5;
  }
}

message StreamChunkResponse {
  bytes data = 1;
  bool is_final = 2;
}

message StreamDone {
  Metrics metrics = 1;
}

message StreamStart {
  int32 status_code = 1;
  string media_type = 2;
  map<string, string> headers = 3;
}

message StreamError {
  string message = 1;
}

// code describes worker *execution* state ("Ok" = the pipeline completed
// normally, "Error" = an exception / worker failure).  The HTTP status of a
// successful response travels separately in SingleResponse.status_code /
// BatchItemResponse.status_code — an "Ok" Status may still carry a 4xx/5xx
// status_code (e.g. early return with Response(status_code=400)).
message Status {
  string code = 1;
  string message = 2;
}

message MetricValue {
  int32 id = 1;
  float value = 2;
}

message Metrics {
  float prefill_ms = 1;
  float decode_ms = 2;
  int32 tokens_generated = 3;
  repeated MetricValue gauges = 4;
  repeated MetricValue counters = 5;
  repeated MetricValue histograms = 6;
}

// ===== gRPC Service =====
service LiteServer {
  rpc Infer(InferRequest) returns (InferResponse);
  rpc BatchInfer(BatchInferRequest) returns (BatchInferResponse);
  rpc StreamInfer(StreamInferRequest) returns (stream StreamChunk);
  rpc BidiStream(stream BidiChunk) returns (stream BidiChunk);
}

message InferRequest {
  string model_name = 1;
  string version = 2;
  bytes data = 3;
  map<string, string> headers = 4;
}

message InferResponse {
  bytes data = 1;
  Status status = 2;
  Metrics metrics = 3;
}

message BatchInferRequest {
  string model_name = 1;
  string version = 2;
  repeated bytes items = 3;
  map<string, string> headers = 4;
}

message BatchInferResponse {
  repeated InferResponse items = 1;
}

message StreamInferRequest {
  string model_name = 1;
  string version = 2;
  bytes data = 3;
  map<string, string> headers = 4;
}

message BidiChunk {
  string stream_id = 1;
  oneof payload {
    BidiOpen open = 2;
    BidiData data = 3;
    BidiClose close = 4;
  }
}

message BidiOpen {
  string model_name = 1;
  string version = 2;
  bytes initial_data = 3;
}

message BidiData {
  bytes data = 1;
}

message BidiClose {
}
