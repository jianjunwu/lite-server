syntax = "proto3";
package lite_server.endpoint.v1;

// ===== Request / Response =====

message EndpointRequest {
    string api_version = 1;          // "v1"
    string request_id = 2;
    string route = 3;
    string method = 4;
    map<string, string> headers = 5;
    map<string, string> query = 6;

    oneof body {
        bytes raw_body = 7;          // Pass-through non-JSON body
        string json_body = 8;        // JSON string
    }

    ServerSnapshot server_state = 9;
}

message ServerSnapshot {
    repeated ModelInfo loaded_models = 1;
    string config_json = 2;          // JSON-encoded config
}

message ModelInfo {
    string name = 1;
    string version = 2;
}

message EndpointResponse {
    string request_id = 1;
    uint32 status_code = 2;
    map<string, string> headers = 3;

    oneof body {
        bytes raw_body = 4;
        string json_body = 5;
    }
}

// ===== Streaming =====

message StreamHeader {
    string request_id = 1;
    uint32 status_code = 2;
    map<string, string> headers = 3;
}

message StreamChunk {
    oneof payload {
        bytes data = 1;              // SSE data frame
        StreamError error = 2;
        StreamDone done = 3;
    }
}

message StreamError {
    string code = 1;
    string message = 2;
}

message StreamDone {}

// ===== Worker Registration =====

message WorkerRegistration {
    string protocol_version = 1;     // "v1"
    repeated Route routes = 2;
    uint32 max_concurrency = 3;      // Declared concurrency capacity
}

message Route {
    string path = 1;
    repeated string methods = 2;
}

message RegistrationAck {
    bool accepted = 1;
    string assigned_worker_id = 2;
    string message = 3;
}
